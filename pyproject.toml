[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyter-vibe-coding"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jupyter_server>=2.0.1,<3",
    "openai>=1.0.0",
    "jupyterlab>=4.5.7"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_vibe_coding/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.sdist.shared-data]
"jupyter_vibe_coding/labextension" = "share/jupyter/labextensions/jupyter-vibe-coding"
"install.json" = "share/jupyter/labextensions/jupyter-vibe-coding/install.json"
"jupyter-config/server-config/jupyter_vibe_coding.json" = "etc/jupyter/jupyter_server_config.d/jupyter_vibe_coding.json"

[tool.hatch.build.targets.wheel]
artifacts = ["jupyter_vibe_coding/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_vibe_coding/labextension" = "share/jupyter/labextensions/jupyter-vibe-coding"
"install.json" = "share/jupyter/labextensions/jupyter-vibe-coding/install.json"
"jupyter-config/server-config/jupyter_vibe_coding.json" = "etc/jupyter/jupyter_server_config.d/jupyter_vibe_coding.json"

[tool.hatch.build.hooks.version]
path = "jupyter_vibe_coding/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_vibe_coding/labextension/static/style.js",
    "jupyter_vibe_coding/labextension/package.json",
]
skip-if-exists = ["jupyter_vibe_coding/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_vibe_coding/labextension"

[tool.jupyter-releaser.options]
version-cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-bump-version = ["python -m pip install 'jupyterlab>=4.0.0,<5' hatch", "jlpm"]
before-release = ["jlpm", "jlpm build:prod"]

[tool.check-wheel-contents]
ignore = ["W002"]
